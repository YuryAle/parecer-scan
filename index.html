<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3c88">
  <meta name="description" content="Escaneie pedidos de parecer, leia os dados com IA e copie para a planilha.">
  <title>Parecer Scan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topo">
    <h1 id="titulo">Parecer Scan</h1>
    <button id="voltar" class="icone" hidden aria-label="Voltar">‹</button>
  </header>

  <main id="tela"></main>

  <nav class="abas">
    <button data-aba="escanear" class="ativa"><span>📷</span>Escanear</button>
    <button data-aba="planilha"><span>📋</span>Planilha</button>
    <button data-aba="pastas"><span>📁</span>Pastas</button>
    <button data-aba="config"><span>⚙️</span>Ajustes</button>
  </nav>

  <input id="camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="galeria" type="file" accept="image/*" hidden>
  <div id="aviso" class="aviso" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
